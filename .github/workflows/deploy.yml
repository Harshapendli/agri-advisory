name: Deploy AgriAdvisory

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd backend
          pip install pytest pytest-asyncio
          pytest -v || echo "No tests yet"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push Docker image
        run: |
          cd backend
          gcloud auth configure-docker
          docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/agri-api .
          docker push gcr.io/${{ secrets.GCP_PROJECT }}/agri-api
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy agri-api \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/agri-api \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},NEO4J_URI=${{ secrets.NEO4J_URI }},NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }},QDRANT_URL=${{ secrets.QDRANT_URL }},QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }},JWT_SECRET=${{ secrets.JWT_SECRET }}"
